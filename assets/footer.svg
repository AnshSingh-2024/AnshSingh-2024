<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="06:00 AM — night shift complete. Open to SDE / ML internships.">
<title>06:00 AM — night shift complete. Open to SDE / ML internships.</title>
<style>
